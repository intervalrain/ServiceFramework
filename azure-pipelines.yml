trigger:
- develop

pool:
  vmImage: ubuntu-latest

variables:
  baseVersion: ''
  fullVersion: ''

jobs:
- job: BuildAndTest
  displayName: Build Solution
  steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9.0 SDK'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'
      includePreviewVersions: true
  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: 'restore'
      projects: '**/*.csproj'
      feedsToUse: 'select'
      vstsFeed: 'd592cbbf-1bf4-4d80-8f88-e70b1ba73d84/bbd4f7fc-436c-4173-aa8a-a1af2e1a3be7'
  - task: DotNetCoreCLI@2
    displayName: dotnet build
    inputs:
      command: 'build'
      projects: '**/*.csproj'
      arguments: '--configuration Release'

- job: createNugetPackage
  displayName: Create Nuget Package
  dependsOn: BuildAndTest
  condition: succeeded()
  steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9.0 SDK'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'
      includePreviewVersions: true
  - task: DotNetCoreCLI@2
    displayName: dotnet restore
    inputs:
      command: 'restore'
      projects: '**/src/**/*.csproj'
      feedsToUse: 'select'
      vstsFeed: 'd592cbbf-1bf4-4d80-8f88-e70b1ba73d84/bbd4f7fc-436c-4173-aa8a-a1af2e1a3be7'
  - task: DotNetCoreCLI@2
    displayName: dotnet build
    inputs:
      command: 'build'
      projects: '**/src/**/*.csproj'
      arguments: '--configuration Release'
  - task: PowerShell@2
    displayName: get version from common.props
    inputs:
      targetType: 'inline'
      script: |
        $propsPath = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Filter "common.props" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        if (-not $propsPath) {
          Write-Error "Could not find common.props"
          exit 1
        }
        
        Write-Host "Found common.props at: $propsPath"
        $propsContent = Get-Content -Path $propsPath -Raw
        $versionRegex = '<Version>(.*?)<\/Version>'
        if ($propsContent -match $versionRegex) {
          $baseVersion = $matches[1]
          Write-Host "Base version from common.props: $baseVersion"
          
          $timestamp = Get-Date -Format "yyMMddHHmmss"
          $fullVersion = "$baseVersion-$timestamp"
          Write-Host "Full version with timestamp: $fullVersion"
          
          # 設置 pipeline 變數
          Write-Host "##vso[task.setvariable variable=baseVersion;]$baseVersion"
          Write-Host "##vso[task.setvariable variable=fullVersion;]$fullVersion"
        } else {
          Write-Error "Could not find Version tag in common.props file"
          exit 1
        }
  - task: DotNetCoreCLI@2
    displayName: dotnet pack
    inputs:
      command: 'pack'
      packagesToPack: '**/src/**/*.csproj'
      configuration: 'Release'
      packDirectory: '$(Build.ArtifactStagingDirectory)'
      nobuild: true
      buildProperties: 'Version=$(fullVersion);IncludeSymbols=true;SymbolPackageFormat=snupkg'
      arguments: '--property:PackOnlyPackableProjects=true' # ignore the sample code pacakges.
  - task: NuGetAuthenticate@1
    displayName: 'NuGet Authenticate'
  - task: DotNetCoreCLI@2
    displayName: dotnet push
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
      nuGetFeedType: 'internal'
      publishVstsFeed: 'd592cbbf-1bf4-4d80-8f88-e70b1ba73d84/bbd4f7fc-436c-4173-aa8a-a1af2e1a3be7'
      arguments: '--skip-duplicate'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  # Add separate push for symbol packages if needed
  - task: DotNetCoreCLI@2
    displayName: push symbol packages
    inputs:
      command: 'push'
      packagesToPush: '$(Build.ArtifactStagingDirectory)/*.snupkg'
      nuGetFeedType: 'internal'
      publishVstsFeed: 'd592cbbf-1bf4-4d80-8f88-e70b1ba73d84/bbd4f7fc-436c-4173-aa8a-a1af2e1a3be7'
      arguments: '--skip-duplicate'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  - task: PublishBuildArtifacts@1
    displayName: publish artifacts
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'nuget-packages'
      publishLocation: 'Container'
