syntax = "proto3";

package EdgeSync.ServiceFramework.Abstractions.Protos;

option csharp_namespace = "EdgeSync.ServiceFramework.Abstractions.Protos";

import "google/protobuf/any.proto";

// Generic error information
message Error {
    string code = 1;
    string description = 2;
    int32 type = 3; // ErrorType enum values
}

// Generic ErrorOr<T> wrapper that can contain any type
message ErrorOrResult {
    oneof result {
        google.protobuf.Any value = 1;  // Success case - contains the actual value
        ErrorList errors = 2;           // Error case - contains the errors
    }
}

// List of errors for ErrorOr failure cases
message ErrorList {
    repeated Error errors = 1;
}

// Generic collection wrapper for List<T>, IEnumerable<T>, etc.
message CollectionResult {
    repeated google.protobuf.Any items = 1;
    string element_type_name = 2; // Full type name of the element type for deserialization
}

// Generic dictionary/map wrapper
message DictionaryResult {
    map<string, google.protobuf.Any> items = 1;
    string key_type_name = 2;   // Full type name of the key type
    string value_type_name = 3; // Full type name of the value type
}

// Generic nullable wrapper
message NullableResult {
    oneof value {
        google.protobuf.Any data = 1;   // Non-null value
        bool is_null = 2;               // Null indicator (true means null)
    }
}

// Wrapper for primitive collections that don't need Any
message StringCollection {
    repeated string items = 1;
}

message Int32Collection {
    repeated int32 items = 1;
}

message Int64Collection {
    repeated int64 items = 1;
}

message DoubleCollection {
    repeated double items = 1;
}

message BoolCollection {
    repeated bool items = 1;
}

// Universal request/response wrapper for any .NET type
message UniversalMessage {
    oneof content {
        google.protobuf.Any typed_data = 1;     // For complex types
        string json_data = 2;                   // Fallback JSON serialization
        ErrorOrResult error_or_result = 3;      // For ErrorOr<T> types
        CollectionResult collection = 4;        // For collection types
        DictionaryResult dictionary = 5;        // For dictionary types
        NullableResult nullable = 6;            // For nullable types
        
        // Optimized primitive collections
        StringCollection string_collection = 11;
        Int32Collection int32_collection = 12;
        Int64Collection int64_collection = 13;
        DoubleCollection double_collection = 14;
        BoolCollection bool_collection = 15;
    }
    
    string type_name = 20; // Full .NET type name for deserialization
}